<!DOCTYPE html> <!-- Tells the browser this is using modern HTML -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSD 340 Web Development with HTML and CSS</title>
    <link rel="stylesheet" href="Sengvanhpheng_Mod6_2.css" /> <!-- Link to css file -->

</head>
<body>
    <header> <!-- HTML 5 header tag -->
        <h1>Assignment 6.2: Build a Web Page - Part 5</h1>
    </header>

    <div id="navbar">
        <a href="#">Home</a> <!-- # link doesn't go to real page -->
        <a href="#">About</a>
        <a href="#">Contact</a>
    </div>

    <div class="card"> <!-- card div with nested divs -->
        <div class="card-title">Top 5 Favorite Foods</div>
        <div class="card-content">
            <!-- ordered list of top 5 foods -->
            <ol>
                <!-- _blank to open link in new tab -->
                <!-- noopener & noreferrer used for security -->
                <li>
                    <a href="https://www.simplyrecipes.com/recipes/how_to_grill_the_best_steak/"
                    target="_blank"
                    rel="noopener noreferrer">
                    Grilled Steak
                    </a>
                </li>

                <li>
                    <a href="https://www.holajalapeno.com/authentic-mexican-burrito-recipe/"
                       target="_blank"
                       rel="noopener noreferrer">
                        Beef Burrito
                    </a>
                </li>

                <li>
                    <a href="https://www.jessicagavin.com/street-tacos/"
                       target="_blank"
                       rel="noopener noreferrer">
                        Street Tacos
                    </a>
                </li>

                <li>
                    <a href="https://hot-thai-kitchen.com/hot-soak-sticky-rice/"
                       target="_blank"
                       rel="noopener noreferrer">
                        Sticky Rice
                    </a>
                </li>

                <li>
                    <a href="https://www.kinders.com/recipes/gas-grill-ribs"
                       target="_blank"
                       rel="noopener noreferrer">
                        BBQ Ribs
                    </a>
                </li>

            </ol>
        </div>
    </div>

    <div id="container"></div>

    <!-- HTML 5 footer element -->
    <footer>
        <a href="../index.html">Back to Landing Page</a>
    </footer>

</body>
</html>
